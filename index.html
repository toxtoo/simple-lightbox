<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Lightbox gallery test v0.5</title>
<link rel="stylesheet" href="css/lightbox.css">
<link rel="stylesheet" href="css/4grid.css">
<script src="js/lightbox.js"></script>


</head>
<body>
<!-- v0.2 Added the custom tooltip. See lightbox.css -->

<div class="gal-wrap">

    <h1>Simple Lightbox gallery</h1>
        <h2>A gallery</h2>

    <div class="row">
        <div class="col one-fourth">
            <a href="img/img-1_full.jpg" rel="lightbox[street]" data-caption="Image 1 caption" data-tip="Click to enlarge">
                <img src="img/img-1_tn.jpg" width="640" alt="Image 1 caption">
            </a>
        </div>
        
       <div class="col one-fourth">
            <a href="img/img-2_full.jpg" rel="lightbox[street]" data-caption="Image 2 caption" data-tip="Click to enlarge">
                <img src="img/img-2_tn.jpg" width="640" alt="Image 2 caption">
            </a>   
       </div>
       
       <div class="col one-fourth">
            <a href="img/img-3_full.jpg" rel="lightbox[street]" data-caption="Image 3 caption" data-tip="Click to enlarge">
                <img src="img/img-3_tn.jpg" width="640" alt="Image 3 caption">
            </a>   
       </div>
       
       <div class="col one-fourth">
            <a href="img/img-4_full.jpg" rel="lightbox[street]" data-caption="Image 4 caption" data-tip="Click to enlarge">
                <img src="img/img-4_tn.jpg" width="640" alt="Image 4 caption">
            </a>   
       </div>
    </div>
    

<div class="row">
   <div class="col one-third">
        <p style="margin-top: 2em;">The street photographs here are AI-generated test images, made for this demo. They are not real photographs of real places or people.</p>
   
   </div>
   <div class="col one-third" style="text-align: center">
        <h2>A single image</h2>
            <a href="img/img-5_full.jpg" rel="lightbox" data-caption="Image 5 caption" data-tip="Click to enlarge">
            <img src="img/img-5_tn.jpg" width="200" alt="Image 5 caption">
            </a>
   </div>
   
   <div class="col one-third">&nbsp;</div>
</div>  
    
   
</div>

</body>
</html>
